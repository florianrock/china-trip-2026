<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendar · China Trip 2026 🇨🇳</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="style.css?v=20260831c" />
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="logo">🇨🇳</div>
      <div class="header-title">
        <h1>Trip Calendar</h1>
        <p class="subtitle">Oct 8–22 · Chengdu · Beijing · Shanghai</p>
      </div>
      <div id="auth-area"><a class="cal-back" href="./">← Back to trip</a></div>
    </div>
  </header>

  <main class="cal-wrap">
    <p class="cal-summary-line"><span id="cal-summary">…</span> — open days are outlined in gold.</p>

    <div class="cal-dow-head">
      <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
    </div>
    <div class="cal-grid" id="cal-grid"></div>

    <p class="itin-note">October 2026 · a day counts as planned once it has at least one entry</p>
  </main>

  <script src="calendar.js"></script>
</body>
</html>
